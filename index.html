```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Pronunciation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top left, #7c3aed 0%, transparent 35%),
        radial-gradient(circle at bottom right, #2563eb 0%, transparent 35%),
        linear-gradient(135deg, #111827, #312e81);
    color: #111827;
}

header {
    background: rgba(15, 23, 42, 0.95);
    color: white;
    padding: 38px 20px;
    text-align: center;
}

.badge {
    display: inline-block;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 15px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 15px;
}

h1 {
    margin: 0;
    font-size: clamp(32px, 6vw, 52px);
}

.subtitle {
    margin-top: 12px;
    opacity: 0.8;
    font-size: 16px;
}

.container {
    width: min(1050px, calc(100% - 30px));
    margin: 30px auto;
}

.panel {
    background: rgba(255,255,255,0.93);
    border-radius: 24px;
    padding: 25px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.25);
}

    display: flex;
    gap: 15px;

}

}

    width: 100%;

    border-color: #7c3aed;

</head>

<body>

<header>
    <div class="badge">🇬🇧 ENGLISH LEARNING</div>
    <h1>English Pronunciation</h1>
    <div class="subtitle">
        Improve your English pronunciation with simple vocabulary
    </div>
</header>

<div class="container">
    <div class="panel">

        <div class="stats">
            <div class="stat">
                Mots disponibles : <span id="wordCount">7</span>
            </div>

            <div class="stat">
                Langue : 🇬🇧 English
            </div>
        </div>

        <input
            id="search"
            class="search"
            type="text"
            placeholder="🔎 Search for a word..."
            autocomplete="off"
        >

        <div class="section-title">📚 Vocabulary</div>

        <div id="words" class="words"></div>

        <div id="noResults" class="no-results">
            Aucun mot trouvé.
        </div>

    </div>
</div>

<footer>
    English Pronunciation • British English 🇬🇧
    <div class="creator">Créé par Nathan</div>
</footer>

<script>

const vocabulary = [
    {
        word: "throat",
        ipa: "/θrəʊt/"
    },
    {
        word: "ache",
        ipa: "/eɪk/"
    },
    {
        word: "tooth",
        ipa: "/tuːθ/"
    },
    {
        word: "that",
        ipa: "/ðæt/"
    },
    {
        word: "with",
        ipa: "/wɪð/"
    },
    {
        word: "thanks",
        ipa: "/θæŋks/"
    },
    {
        word: "stomach",
        ipa: "/ˈstʌmək/"
    }
];

const wordsContainer = document.getElementById("words");
const searchInput = document.getElementById("search");
const noResults = document.getElementById("noResults");
const wordCount = document.getElementById("wordCount");

wordCount.textContent = vocabulary.length;

function renderWords(list) {

    wordsContainer.innerHTML = "";

    noResults.style.display =
        list.length === 0 ? "block" : "none";

    list.forEach(item => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div>
                <div class="word">${item.word}</div>
                <div class="ipa">${item.ipa}</div>
            </div>

            <button
                class="audio-button"
                aria-label="Pronounce ${item.word}"
                onclick="pronounce('${item.word}', this)"
            >
                🔊
            </button>
        `;

        wordsContainer.appendChild(card);
    });
}

function getBritishVoice() {

    const voices = speechSynthesis.getVoices();

    // Priorité absolue aux voix britanniques
    let voice = voices.find(v =>
        v.lang && v.lang.toLowerCase() === "en-gb"
    );

    if (!voice) {
        voice = voices.find(v =>
            v.lang && v.lang.toLowerCase().startsWith("en-gb")
        );
    }

    return voice;
}

function pronounce(word, button) {

    speechSynthesis.cancel();

    document
        .querySelectorAll(".audio-button")
        .forEach(btn => btn.classList.remove("playing"));

    const voice = getBritishVoice();

    if (!voice) {

        alert(
            "Aucune voix anglaise britannique (English UK) n'est disponible sur cet appareil."
        );

        return;
    }

    const utterance =
        new SpeechSynthesisUtterance(word);

    utterance.voice = voice;
    utterance.lang = "en-GB";

    utterance.rate = 0.78;
    utterance.pitch = 1;

    button.classList.add("playing");

    utterance.onend = function() {
        button.classList.remove("playing");
    };

    utterance.onerror = function() {
        button.classList.remove("playing");
    };

    speechSynthesis.speak(utterance);
}

searchInput.addEventListener("input", function() {

    const query =
        this.value.trim().toLowerCase();

    const filtered =
        vocabulary.filter(item =>
            item.word.toLowerCase().includes(query)
        );

    renderWords(filtered);
});

// Certaines voix sont chargées après le démarrage du navigateur.
speechSynthesis.addEventListener(
    "voiceschanged",
    () => {}
);

renderWords(vocabulary);

</script>

</body>
</html>
